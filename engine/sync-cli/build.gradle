// The command line: `snout-engine sync <projectDir> [--out model.json]` and
// `snout-engine lsp <projectDir>`. The distribution carries jdtls and the importer bundle:
//
//   bin/snout-engine
//   lib/                  snout-engine and its dependencies
//   jdtls/                the pinned jdtls release, as downloaded
//   jdtls-plugins/        com.snoutcode.engine.jdtls_<version>.jar, com.snoutcode.engine.spring_<version>.jar
//                         and java-debug's com.microsoft.java.debug.plugin-<version>.jar

plugins {
    id 'application'
}

evaluationDependsOn(':jdtls-importer')
evaluationDependsOn(':spring')
def importer = project(':jdtls-importer')
def spring = project(':spring')

dependencies {
    implementation project(':sync-plugin')
    implementation "org.gradle:gradle-tooling-api:${rootProject.toolingApiVersion}"
    implementation 'com.google.code.gson:gson:2.11.0'
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
    // StopTestDaemons listens to the test run's end.
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'com.snoutcode.engine.cli.SnoutEngine'
    applicationName = 'snout-engine'
}

distributions {
    main {
        contents {
            from(importer.jdtlsHome) {
                into 'jdtls'
            }
            from(importer.tasks.named('jar')) {
                into 'jdtls-plugins'
            }
            from(importer.javaDebugBundle) {
                into 'jdtls-plugins'
            }
            from(spring.tasks.named('jar')) {
                into 'jdtls-plugins'
            }
        }
    }
}

tasks.named('test') {
    // The integration test drives a real Gradle build of the same version as this one.
    systemProperty 'snout.test.gradleVersion', gradle.gradleVersion
    systemProperty 'snout.test.fixtures', file('src/test/fixtures').absolutePath
    systemProperty 'snout.test.scratch', layout.buildDirectory.dir('test-scratch').get().asFile.absolutePath
    // The builds the tests run get a daemon registry of their own, never ~/.gradle/daemon, with
    // the engine's short idle time; StopTestDaemons stops them when the tests end.
    systemProperty 'snout.engine.daemonRegistry', layout.buildDirectory.dir('test-daemons').get().asFile.absolutePath
}

// The self-contained distribution the app runs: the installed CLI with jdtls and the importer
// bundle, plus a jlink'd Java 21 runtime in runtime/, so the app needs no JDK of its own to
// start the engine. The runtime is linked from the JDK running this build (JAVA_HOME), which
// must be 21: jdtls 1.61 runs on Java 21.
//
//   engine/build/dist/
//     runtime/           java for snout-engine and jdtls
//     lib/ jdtls/ jdtls-plugins/
//     bin/snout-engine   a launcher that uses runtime/
//     dist.properties    what was built, for staleness checks

def runtimeDir = rootProject.layout.buildDirectory.dir('runtime')

def jlinkRuntime = tasks.register('jlinkRuntime') {
    description = 'Links a Java 21 runtime from the JDK running the build.'
    def javaHome = file(System.getProperty('java.home'))
    inputs.property('javaVersion', System.getProperty('java.version'))
    inputs.property('javaHome', javaHome.absolutePath)
    outputs.dir(runtimeDir)
    doLast {
        int feature = Runtime.version().feature()
        if (feature != 21) {
            throw new GradleException("The engine distribution needs JDK 21 (JAVA_HOME); this build runs on Java ${feature} at ${javaHome}.")
        }
        File jmods = new File(javaHome, 'jmods')
        if (!jmods.isDirectory()) {
            throw new GradleException("${javaHome} has no jmods folder to link a runtime from; use a full JDK 21.")
        }
        File out = runtimeDir.get().asFile
        out.deleteDir()
        def jlink = new ProcessBuilder(new File(javaHome, 'bin/jlink').absolutePath,
            '--module-path', jmods.absolutePath,
            '--add-modules', 'ALL-MODULE-PATH',
            '--strip-debug', '--no-man-pages', '--no-header-files', '--compress=zip-6',
            '--output', out.absolutePath).redirectErrorStream(true).start()
        String output = jlink.inputStream.text
        if (jlink.waitFor() != 0) {
            throw new GradleException("jlink failed:\n${output}")
        }
        // jlink writes some files read only (the legal notices), which a later sync of
        // the distribution could not replace.
        out.eachFileRecurse { it.setWritable(true, true) }
    }
}

// The distribution is built in a fresh folder and swapped in whole, never written over: macOS
// keeps a binary's code signature per file, and kills a binary that was rewritten in place
// (runtime/bin/java exiting with 137 on its next launch). -PsnoutDistDir=<dir> builds it there
// instead (scripts/package-mac.sh), leaving engine/build/dist to the app running from it.
def distDir = project.hasProperty('snoutDistDir')
    ? project.objects.directoryProperty().fileValue(file(project.property('snoutDistDir')))
    : rootProject.layout.buildDirectory.dir('dist')

tasks.register('snoutDist') {
    description = 'Assembles the self-contained engine distribution in engine/build/dist.'
    group = 'distribution'
    def install = tasks.named('installDist')
    inputs.files(install)
    inputs.files(jlinkRuntime)
    inputs.property('version', project.version.toString())
    outputs.dir(distDir)
    doLast {
        File dist = distDir.get().asFile
        File parent = dist.parentFile
        File staging = new File(parent, 'dist.new')
        File old = new File(parent, 'dist.old')
        project.delete(staging, old)
        // The CLI's own launcher scripts look for JAVA_HOME; bin/snout-engine uses the bundled runtime.
        project.copy {
            from(install.get().destinationDir) {
                exclude 'bin/**'
            }
            from(runtimeDir) {
                into 'runtime'
            }
            into staging
        }
        File bin = new File(staging, 'bin')
        bin.mkdirs()
        File launcher = new File(bin, 'snout-engine')
        launcher.text = '''#!/bin/sh
# snout-engine on the bundled Java runtime.
here="$(cd "$(dirname "$0")/.." && pwd)"
exec "$here/runtime/bin/java" -cp "$here/lib/*" com.snoutcode.engine.cli.SnoutEngine "$@"
'''
        launcher.setExecutable(true, false)
        new File(staging, 'dist.properties').text =
            "version=${project.version}\njava=${System.getProperty('java.version')}\n"
        File java = new File(staging, 'runtime/bin/java')
        if (System.getProperty('os.name').toLowerCase().contains('mac')) {
            // An unsigned or broken signature gets the binary killed: sign it ad hoc when needed.
            def verify = new ProcessBuilder('codesign', '--verify', java.absolutePath).redirectErrorStream(true).start()
            verify.inputStream.text
            if (verify.waitFor() != 0) {
                def sign = new ProcessBuilder('codesign', '--force', '--sign', '-', java.absolutePath).redirectErrorStream(true).start()
                String out = sign.inputStream.text
                if (sign.waitFor() != 0) {
                    throw new GradleException("could not sign ${java}:\n${out}")
                }
            }
        }
        // Swap: the old distribution moves aside, the new one takes its name, the old one goes.
        if (dist.exists() && !dist.renameTo(old)) {
            throw new GradleException("could not move ${dist} aside")
        }
        if (!staging.renameTo(dist)) {
            throw new GradleException("could not move ${staging} to ${dist}")
        }
        project.delete(old)
        checkRuntime(new File(dist, 'runtime/bin/java'))
    }
}

/** Fails the build unless the runtime starts: {@code java -version}. */
static void checkRuntime(File java) {
    def check = new ProcessBuilder(java.absolutePath, '-version').redirectErrorStream(true).start()
    String out = check.inputStream.text
    int exit = check.waitFor()
    if (exit != 0) {
        throw new GradleException("${java} -version failed with exit code ${exit}:\n${out}")
    }
}
