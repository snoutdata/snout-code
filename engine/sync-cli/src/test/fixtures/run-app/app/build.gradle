plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'demo.app.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('hello') {
    group = 'demo'
    description = 'Says hello.'
    doLast {
        println 'hello from the hello task'
    }
}

// Shows the heap the Scala compiler gets in a run (the engine's init script sets one when the
// build does not).
def scalaProbe = tasks.register('scalaProbe', ScalaCompile)
tasks.register('scalaHeap') {
    def probe = scalaProbe.get()
    doLast {
        println "scala heap ${probe.scalaCompileOptions.forkOptions.memoryMaximumSize}"
    }
}
