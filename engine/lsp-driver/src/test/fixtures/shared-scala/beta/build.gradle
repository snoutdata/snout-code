// Compiles the shared folder into itself, Java and Scala jointly, as its own Scala does.
plugins {
    id 'scala'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.scala-lang:scala-library:2.13.15'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.java.srcDirs = []
sourceSets.main.scala.srcDirs = ['src/main/scala', '../shared/src/main/scala']
