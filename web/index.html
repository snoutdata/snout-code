<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!--head-->
		<meta name="theme-color" content="#f7f7f4" />
		<meta property="og:site_name" content="SnoutCode" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://snoutcode.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://snoutcode.com/og-image.png" />

		<!-- Apply a saved theme choice before first paint, so there is no light/dark flash. -->
		<script>
			document.documentElement.classList.add('js')
			try {
				var t = localStorage.getItem('theme')
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t
				}
			} catch (e) {}
		</script>

		<!-- The page is prerendered in English. For a visitor in another of the site's languages
		     (a saved choice, else the browser's; the same rule as detectLocale() in src/i18n),
		     hide it until React has switched it, so English never flashes. -->
		<script>
			try {
				var supported = ['en', 'fr', 'es', 'pt']
				var lang = null
				try {
					lang = localStorage.getItem('lang')
				} catch (e) {}
				if (supported.indexOf(lang) === -1) {
					lang = 'en'
					var tags = navigator.languages || [navigator.language]
					for (var i = 0; i < tags.length; i++) {
						var base = (tags[i] || '').toLowerCase().split('-')[0]
						if (supported.indexOf(base) !== -1) {
							lang = base
							break
						}
					}
				}
				if (lang !== 'en') {
					document.documentElement.lang = lang
					document.documentElement.classList.add('i18n-wait')
				}
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"><!--app--></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
