<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!--head-->
		<meta name="theme-color" content="#f7f7f4" />
		<meta property="og:site_name" content="SnoutCode" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://snoutcode.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://snoutcode.com/og-image.png" />

		<!-- Apply a saved theme choice before first paint, so there is no light/dark flash. -->
		<script>
			document.documentElement.classList.add('js')
			try {
				var t = localStorage.getItem('theme')
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t
				}
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"><!--app--></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
