[workspace]
resolver = "3"
members = [
    "crates/snout-core",
    "crates/snout-gui",
    "crates/snout-app",
    "crates/snout-lang",
    "crates/snout-remote-proto",
    "crates/snout-remote",
    "crates/snout-server",
    "crates/snout-host",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/snoutdata/snout-code"

[workspace.dependencies]
snout-core = { path = "crates/snout-core" }
snout-lang = { path = "crates/snout-lang" }
snout-host = { path = "crates/snout-host" }
snout-remote-proto = { path = "crates/snout-remote-proto" }
snout-remote = { path = "crates/snout-remote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "3"
eframe = { version = "0.37", features = ["persistence"] }
# The emoji fonts provide the toolbar icons (⬇ ⬆ ⟳ …).
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
portable-pty = "0.9"
vt100 = "0.16"
anyhow = "1"
# snout-server: file watching, signals and process groups, and the checksum of its binary.
notify = "8"
libc = "0.2"
sha2 = "0.10"
tempfile = "3"
rfd = "0.17"
# The native macOS menu bar.
muda = { version = "0.21", default-features = false }
# eframe's windowing; snout only switches off its default macOS menu.
winit = { version = "0.30", default-features = false }
# One AppKit setting: no window tabs (macOS would add their items to the View menu).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
# Paste from the Edit menu (egui-winit already links it).
arboard = { version = "3", default-features = false }
# The GPUI app. GPUI is pinned to exactly the release GPUI Kit (gpui-component) pins.
gpui = { package = "gpui-pre", version = "=0.3.10" }
# GPUI Kit's styled components, and the platform layer of the same GPUI release. (The
# gpui-kit facade crate cannot join this workspace: its optional gpui-fast backend pins a
# unicode-properties that egui's epaint rules out.)
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "runtime_shaders"] }
gpui-component = { version = "=0.8.1", features = ["tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-yaml"] }
