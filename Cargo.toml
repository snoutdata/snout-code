[workspace]
resolver = "3"
members = [
    "crates/snout-core",
    "crates/snout-app",
    "crates/snout-lang",
    "crates/snout-remote-proto",
    "crates/snout-remote",
    "crates/snout-server",
    "crates/snout-host",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/snoutdata/snout-code"

[workspace.dependencies]
snout-core = { path = "crates/snout-core" }
snout-lang = { path = "crates/snout-lang" }
snout-host = { path = "crates/snout-host" }
snout-remote-proto = { path = "crates/snout-remote-proto" }
snout-remote = { path = "crates/snout-remote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON schemas made from the settings' types (Settings as text).
schemars = { version = "1", default-features = false, features = ["std", "derive"] }
thiserror = "2"
similar = "3"
portable-pty = "0.9"
vt100 = "0.16"
# The Ghostty terminal engine (snout-core's `ghostty` feature): safe bindings, and the -sys
# crate that builds libghostty-vt.a from Ghostty's sources with Zig 0.15. Pinned: the API is
# not stable yet.
libghostty-vt = { version = "=0.2.2", default-features = false }
libghostty-vt-sys = { version = "=0.2.2" }
anyhow = "1"
# snout-server: file watching, signals and process groups, and the checksum of its binary.
notify = "8"
libc = "0.2"
sha2 = "0.10"
tempfile = "3"
# The GPUI app. GPUI is pinned to exactly the release GPUI Kit (gpui-component) pins.
gpui = { package = "gpui-pre", version = "=0.3.10" }
# GPUI Kit's styled components, and the platform layer of the same GPUI release. (The
# gpui-kit facade crate cannot join this workspace: its optional gpui-fast backend pins a
# unicode-properties that egui's epaint rules out.)
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = { version = "=0.8.1", features = ["tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-yaml", "tree-sitter-html"] }
