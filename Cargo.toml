[workspace]
resolver = "3"
members = ["crates/snout-core", "crates/snout-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/snoutdata/snout-git"

[workspace.dependencies]
snout-core = { path = "crates/snout-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "3"
eframe = { version = "0.37", features = ["persistence"] }
# The emoji fonts provide the toolbar icons (⬇ ⬆ ⟳ …).
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
portable-pty = "0.9"
vt100 = "0.16"
anyhow = "1"
rfd = "0.17"
# The native macOS menu bar.
muda = { version = "0.21", default-features = false }
# eframe's windowing; snout only switches off its default macOS menu.
winit = { version = "0.30", default-features = false }
# One AppKit setting: no window tabs (macOS would add their items to the View menu).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
# Paste from the Edit menu (egui-winit already links it).
arboard = { version = "3", default-features = false }
