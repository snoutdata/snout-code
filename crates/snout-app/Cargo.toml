[package]
name = "snout-app"
description = "SnoutCode: the GPUI app (activity bar, docks and the Git Panel)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "snout-code"
path = "src/main.rs"

[features]
# The Ghostty terminal engine (see snout-core): Settings ▸ Terminal offers it.
ghostty = ["snout-core/ghostty"]

[dependencies]
snout-core.workspace = true
snout-lang.workspace = true
snout-host.workspace = true
snout-remote.workspace = true
# The protocol's types, the version GPUI Kit's editor speaks.
lsp-types = { version = "0.97", features = ["proposed"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
# Shared futures: one hover request answers every ask for the same word.
futures = "0.3"
gpui.workspace = true
gpui-component.workspace = true
# GPUI Kit's foundation, the release GPUI Kit pins: the dock's resize-handle context, so
# the app's dock skin can wrap GPUI Kit's and draw its own editor tabs.
gpui-base = { version = "=0.8.1", default-features = false }
gpui-platform.workspace = true
# GPUI Kit's icons (Lucide) and other assets.
gpui-kit-assets = "=0.8.1"
# Hack, the editor's typeface (the egui app's monospace one).
epaint_default_fonts = "=0.37.0"
# Grammars GPUI Kit does not carry: Groovy (Gradle scripts) and Java properties files. The
# tree-sitter version is the one GPUI Kit's highlighter links.
tree-sitter = "0.26"
dekobon-tree-sitter-groovy = "0.3"
tree-sitter-properties = "0.3"
# What a project's .gitignore leaves out (the host walks and watches the tree, and finds text).
ignore = "0.4"
# Go to file.
fuzzy-matcher = "0.3"
# Find and Replace in Files: regular expressions, and file masks.
regex = "1"
globset = "0.4"
# Reads the earlier app's eframe storage (RON), never writes it.
ron = "0.12"
# Claude Code's IDE connection: a WebSocket server on 127.0.0.1, the diffs it proposes,
# and whether the process that wrote a lock file is still alive.
tungstenite = "0.29"
similar.workspace = true
libc = "0.2"
# The engine's daemon registry names (SHA-256 of the project folder), for the Processes window.
sha2 = "0.10"
# A scratch folder for a JDK fetched on the Mac for a remote machine.
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Open in External Terminal: the terminal apps installed, by bundle id (LaunchServices); and
# the menu bar's icons, set on the NSMenuItems GPUI makes.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSImage"] }
# Lucide icons drawn for menu items that have no SF Symbol (GPUI's own SVG renderer).
resvg = { version = "0.46", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
gpui-platform = { workspace = true, features = ["test-support"] }

[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
harness = false

[[test]]
name = "host_probe"
path = "tests/host_probe.rs"
harness = false

[[test]]
name = "remote_e2e"
path = "tests/remote_e2e.rs"
harness = false
