[package]
name = "snout-app"
description = "SnoutCode: the GPUI app (activity bar, docks and the Git Panel)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "snout-code"
path = "src/main.rs"

[dependencies]
snout-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
gpui.workspace = true
gpui-component.workspace = true
# GPUI Kit's foundation, the release GPUI Kit pins: the dock's resize-handle context, so
# the app's dock skin can wrap GPUI Kit's and draw its own editor tabs.
gpui-base = { version = "=0.8.1", default-features = false }
gpui-platform.workspace = true
# GPUI Kit's icons (Lucide) and other assets.
gpui-kit-assets = "=0.8.1"
# The egui app's own typefaces (Ubuntu Light and Hack), so the Git view reads the same.
epaint_default_fonts = "=0.37.0"
# Grammars GPUI Kit does not carry: Groovy (Gradle scripts) and Java properties files. The
# tree-sitter version is the one GPUI Kit's highlighter links.
tree-sitter = "0.26"
dekobon-tree-sitter-groovy = "0.3"
tree-sitter-properties = "0.3"
# The file tree: walking (honouring .gitignore) and watching the repository.
ignore = "0.4"
notify = "8"
# Find in files and go to file.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
fuzzy-matcher = "0.3"
# Reads the earlier app's eframe storage (RON), never writes it.
ron = "0.12"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
gpui-platform = { workspace = true, features = ["test-support"] }
# The LSP types GPUI Kit's editor speaks (its own version).
lsp-types = { version = "0.97", features = ["proposed"] }

[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
harness = false
