[package]
name = "snout-update"
description = "SnoutCode's updates: the signed release feed, the download, and putting the new version in place"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
# Makes the signing key and signs a release's feed (scripts/make-update-feed.sh).
name = "snout-update-sign"
path = "src/bin/sign.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snout-host.workspace = true
# The feed's signature: what says a release is ours, on Windows too, where the installers are
# not code signed yet.
ed25519-dalek = "2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
